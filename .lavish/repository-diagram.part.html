<section class="card bg-base-200 p-6 mb-6" id="layout-figure">
<h2 class="text-xl font-bold mb-2">What has been settled so far</h2>
<p class="opacity-80 mb-4">One repository, one job (job 12) with two writing workers and one reviewer. Branch names are only examples.</p>
<svg viewBox="0 0 860 400" width="100%" role="img" aria-labelledby="fig-title" style="color:#e2e8f0;font-family:system-ui,sans-serif">
<title id="fig-title">AsmAI clone, job branch and per-assignment workspaces</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g id="origin"><title>origin on GitHub: the job branch is pushed here and becomes the PR</title>
<rect x="20" y="40" width="180" height="70" rx="10" fill="#132e43" stroke="#38bdf8"/>
<text x="110" y="70" text-anchor="middle" font-weight="700" fill="currentColor">origin (GitHub)</text>
<text x="110" y="92" text-anchor="middle" font-size="13" fill="#bae6fd">main · PR from job branch</text></g>
<g id="user-checkout"><title>Your own registered checkout: never touched by jobs</title>
<rect x="20" y="290" width="180" height="70" rx="10" fill="none" stroke="#64748b" stroke-dasharray="6 5"/>
<text x="110" y="320" text-anchor="middle" font-weight="700" fill="currentColor">your checkout</text>
<text x="110" y="342" text-anchor="middle" font-size="13" fill="#94a3b8">untouched by jobs</text></g>
<g id="clone"><title>AsmAI's own clone of the registered repository, in its state directory</title>
<rect x="290" y="40" width="210" height="70" rx="10" fill="#1e293b" stroke="#a78bfa"/>
<text x="395" y="68" text-anchor="middle" font-weight="700" fill="currentColor">AsmAI clone</text>
<text x="395" y="90" text-anchor="middle" font-size="13" fill="#c4b5fd">~/.local/state/asmai/…</text></g>
<g id="edge-fetch"><title>fetch from origin; push the job branch and every worker branch to origin</title>
<line x1="205" y1="66" x2="284" y2="66" stroke="currentColor" marker-end="url(#arr)"/>
<line x1="284" y1="88" x2="205" y2="88" stroke="currentColor" marker-end="url(#arr)"/>
<text x="245" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">fetch</text>
<text x="245" y="106" text-anchor="middle" font-size="12" fill="#94a3b8">push</text></g>
<g id="job-branch"><title>The job branch: receives only accepted work, becomes the PR</title>
<rect x="590" y="40" width="250" height="70" rx="10" fill="#132e43" stroke="#38bdf8" stroke-width="2"/>
<text x="715" y="68" text-anchor="middle" font-weight="700" fill="currentColor">job branch</text>
<text x="715" y="90" text-anchor="middle" font-size="13" fill="#bae6fd">asmai/12-config-option</text></g>
<line x1="505" y1="75" x2="584" y2="75" stroke="currentColor" marker-end="url(#arr)"/>
<g id="ws-a"><title>Writing workspace: worker1@engineering on its own branch from the job branch tip</title>
<rect x="290" y="190" width="170" height="80" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="375" y="216" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">worker1@engineering</text>
<text x="375" y="238" text-anchor="middle" font-size="12" fill="#6ee7b7">writes asmai/12/a31</text>
<text x="375" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">own workspace</text></g>
<g id="ws-b"><title>Writing workspace: worker2@engineering on its own branch from the job branch tip</title>
<rect x="480" y="190" width="170" height="80" rx="10" fill="#1e293b" stroke="#34d399"/>
<text x="565" y="216" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">worker2@engineering</text>
<text x="565" y="238" text-anchor="middle" font-size="12" fill="#6ee7b7">writes asmai/12/a32</text>
<text x="565" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">own workspace</text></g>
<g id="ws-c"><title>Read-only workspace: worker1@quality detached at the exact commit it reviews</title>
<rect x="670" y="190" width="170" height="80" rx="10" fill="#1e293b" stroke="#fbbf24"/>
<text x="755" y="216" text-anchor="middle" font-weight="700" font-size="14" fill="currentColor">worker1@quality</text>
<text x="755" y="238" text-anchor="middle" font-size="12" fill="#fcd34d">detached at 3f9c2e1</text>
<text x="755" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">read-only review</text></g>
<g id="edges-ws"><title>Workspaces branch from the job branch tip; accepted work returns to it</title>
<path d="M640,112 C600,150 420,150 380,186" fill="none" stroke="#34d399" marker-end="url(#arr)"/>
<path d="M680,112 C640,150 600,150 570,186" fill="none" stroke="#34d399" marker-end="url(#arr)"/>
<path d="M760,112 L760,186" fill="none" stroke="#fbbf24" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="470" y="146" text-anchor="middle" font-size="12" fill="#6ee7b7">branch from tip</text></g>
<g id="edge-accept"><title>On acceptance the daemon fast-forwards the job branch to the accepted commit</title><path d="M455,192 C520,140 600,128 640,114" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arr)"/></g>
<text x="565" y="320" text-anchor="middle" font-size="13" fill="#7dd3fc">dashed blue: on acceptance the daemon fast-forwards the job branch</text>
<text x="565" y="345" text-anchor="middle" font-size="13" fill="#94a3b8">one writer per branch at any time; worker branches are pushed to origin too</text>
</svg>
</section>
